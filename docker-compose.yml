version: '3.9'\n\nservices:\n  mongodb:\n    image: mongo:7\n    environment:\n      MONGO_INITDB_ROOT_USERNAME: admin\n      MONGO_INITDB_ROOT_PASSWORD: admin123\n    ports:\n      - \"27017:27017\"\n    volumes:\n      - mongodb_data:/data/db\n    healthcheck:\n      test: echo 'db.adminCommand(\"ping\")' | mongosh localhost:27017/test\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  redis:\n    image: redis:7\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis_data:/data\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  backend:\n    build: ./backend\n    command: npm run dev\n    ports:\n      - \"5000:5000\"\n    environment:\n      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/agrismarten\n      - REDIS_URL=redis://redis:6379\n      - NODE_ENV=development\n      - JWT_SECRET=dev-secret-key\n      - FRONTEND_URL=http://localhost:3000\n    depends_on:\n      mongodb:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    volumes:\n      - ./backend/src:/app/src\n\n  frontend:\n    build: ./frontend\n    command: npm run dev\n    ports:\n      - \"3000:3000\"\n    environment:\n      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1\n    depends_on:\n      - backend\n    volumes:\n      - ./frontend/src:/app/src\n\nvolumes:\n  mongodb_data:\n  redis_data: